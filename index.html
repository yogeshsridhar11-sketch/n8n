<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yogesh AI – Smart Assistant</title>
  <meta name="description" content="Yogesh AI – A smart conversational assistant powered by n8n and OpenRouter." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="logo-text">Yogesh AI</span>
      </div>
      <button class="new-chat-btn" id="newChatBtn" title="New Chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="sidebar-section-label">Recent Chats</div>
    <div class="history-list" id="historyList"></div>

    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="avatar user-avatar-sm">Y</div>
        <div class="user-info">
          <span class="user-name">Yogesh Sridhar</span>
          <span class="user-plan">Pro Plan</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="chat-main">

    <!-- Top Bar -->
    <header class="topbar">
      <button class="topbar-btn" id="sidebarToggle" title="Toggle Sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="model-badge">
        <span class="model-dot"></span>
        OpenRouter LLM · n8n
      </div>
      <button class="topbar-btn" id="clearBtn" title="Clear Chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <!-- Messages Container -->
    <div class="messages-container" id="messagesContainer">

      <!-- Welcome Screen -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-glow"></div>
        <div class="welcome-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="welcome-title">How can I help you today?</h1>
        <p class="welcome-subtitle">Powered by OpenRouter · Built with n8n</p>
        <div class="suggestion-grid">
          <button class="suggestion-card" data-prompt="What are the latest trends in AI and machine learning?">
            <span class="suggestion-icon">🤖</span>
            <span>AI &amp; ML Trends</span>
          </button>
          <button class="suggestion-card" data-prompt="Help me write a professional email to a client.">
            <span class="suggestion-icon">✉️</span>
            <span>Write an email</span>
          </button>
          <button class="suggestion-card" data-prompt="Explain quantum computing in simple terms.">
            <span class="suggestion-icon">⚛️</span>
            <span>Explain a concept</span>
          </button>
          <button class="suggestion-card" data-prompt="Give me a healthy 7-day meal plan.">
            <span class="suggestion-icon">🥗</span>
            <span>Meal planning</span>
          </button>
          <button class="suggestion-card" data-prompt="How can I apply for an ICICI Bank personal loan online?">
            <span class="suggestion-icon">🏦</span>
            <span>Bank loan info</span>
          </button>
          <button class="suggestion-card" data-prompt="Write a Python function to sort a list of dictionaries.">
            <span class="suggestion-icon">💻</span>
            <span>Code help</span>
          </button>
        </div>
      </div>

      <!-- Chat messages rendered here -->
      <div class="messages-list" id="messagesList"></div>

    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea
          id="userInput"
          class="chat-input"
          placeholder="Message Yogesh AI..."
          rows="1"
          maxlength="4000"
        ></textarea>
        <div class="input-actions">
          <span class="char-count" id="charCount">0 / 4000</span>
          <button class="send-btn" id="sendBtn" disabled title="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
      <p class="input-disclaimer">Yogesh AI can make mistakes. Verify important information.</p>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
